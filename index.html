<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suspense Account Movement</title>
<style>
:root{--bg:#f5f7fb;--ink:#10213b;--muted:#64748b;--line:#dbe3ef;--blue:#2563eb;--in:#059669;--out:#dc2626}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eef4ff,var(--bg) 180px);font:15px Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}.shell{max-width:1400px;margin:auto;padding:28px 20px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}h1{margin:0;font-size:clamp(1.6rem,3vw,2.4rem)}h2{font-size:1rem;margin:0}.sub{color:var(--muted);margin-top:5px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted)}.toolbar,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #10213b0c}.toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:15px;margin-bottom:18px}.file{position:relative;overflow:hidden;display:inline-flex;align-items:center;background:var(--blue);color:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}button,select,input{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--blue)}select{min-width:180px}.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi{padding:17px}.label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}.value{font-size:1.55rem;font-weight:800;margin-top:8px}.in{color:var(--in)}.out{color:var(--out)}.net-positive{color:var(--in)}.net-negative{color:var(--out)}.card{padding:18px;margin-bottom:18px}.chart-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}.legend{display:flex;gap:14px;color:var(--muted);font-size:.85rem}.legend span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:currentColor}.legend .in{color:var(--in)}.legend .out{color:var(--out)}svg{display:block;width:100%;height:280px;background:linear-gradient(#fff,#f8fbff);border:1px solid #edf1f7;border-radius:10px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.77rem;text-transform:uppercase;letter-spacing:.04em;background:#f8fafc}.direction{font-weight:800}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.kpis{grid-template-columns:1fr}.toolbar>*{width:100%}}
</style>
</head>
<body><main class="shell">
<header><div><h1>Suspense Account Movement</h1><div class="sub">Track money moving into and out of suspense accounts</div></div><div class="pill" id="source">Demo data loaded</div></header>
<section class="toolbar"><label class="file">Load CSV<input id="file" type="file" accept=".csv,.txt"></label><button id="sample">Generate sample</button><button id="reset">Reset filters</button><div class="filters"><select id="account"><option value="all">All accounts</option></select><input id="from" type="date" aria-label="Date from"><input id="to" type="date" aria-label="Date to"></div></section>
<section class="kpis"><div class="card kpi"><div class="label">Money in</div><div class="value in" id="inTotal">$0.00</div></div><div class="card kpi"><div class="label">Money out</div><div class="value out" id="outTotal">$0.00</div></div><div class="card kpi"><div class="label">Net movement</div><div class="value" id="net">$0.00</div></div><div class="card kpi"><div class="label">Transactions</div><div class="value" id="count">0</div></div></section>
<section class="card"><div class="chart-head"><div><h2>Movement over time</h2><div class="sub">Daily inflows and outflows for the selected account and dates</div></div><div class="legend"><span class="in">In</span><span class="out">Out</span></div></div><svg id="chart" viewBox="0 0 1000 280" role="img" aria-label="Chart of money moving into and out of suspense account"></svg></section>
<section class="card"><div class="chart-head"><h2>Movement detail</h2><span class="sub" id="shown"></span></div><div class="table-wrap" id="table"></div></section>
</main><script>
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
let rows=[];let filters={account:'all',from:'',to:''};
function sample(n=180){const accounts=['2001-AR Clearing','2102-AP Clearing','2204-Tax Suspense'];const out=[];const now=new Date();for(let i=0;i<n;i++){const d=new Date(now);d.setDate(d.getDate()-Math.floor(Math.random()*45));out.push({id:'REF-'+(100000+i),date:d.toISOString().slice(0,10),account:accounts[i%accounts.length],direction:i%3?'IN':'OUT',amount:+(200+Math.random()*14500).toFixed(2),reason:['Unmatched receipt','Pending approval','Clearing adjustment','Review required'][i%4]})}return out}
function parseCSV(text){const lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw Error('CSV needs a header and at least one row');const h=lines[0].split(',').map(x=>x.trim().toLowerCase().replace(/^"|"$/g,''));return lines.slice(1).map((line,i)=>{const p=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));const r={};h.forEach((k,j)=>r[k]=p[j]||'');return normalize(r,i)})}
function normalize(r,i){const get=(...keys)=>{const k=keys.find(x=>r[x]!==undefined&&r[x]!=='');return k?r[k]:''};let direction=String(get('direction','movement','flow','in_out','type','debit_credit')).toUpperCase();let amount=Math.abs(Number(String(get('amount','value','amt','total_amount')||0).replace(/[$,]/g,''))||0);if(!direction)direction=Number(get('signed_amount','net_amount'))<0?'OUT':'IN';if(/OUT|CREDIT|DEBIT|PAYMENT|WITHDRAW/.test(direction))direction='OUT';else direction='IN';return{id:get('transaction_id','id','txn_id','reference')||'TXN-'+(i+1),date:get('posting_date','transaction_date','date','posted_date')||new Date().toISOString().slice(0,10),account:get('suspense_account','account','account_name','gl_account')||'Unknown account',direction,amount,reason:get('reason','explanation','note')||'Not provided'} }
function filtered(){return rows.filter(r=>(filters.account==='all'||r.account===filters.account)&&(!filters.from||r.date>=filters.from)&&(!filters.to||r.date<=filters.to)).sort((a,b)=>b.date.localeCompare(a.date))}
function options(){const vals=[...new Set(rows.map(r=>r.account))].sort();$('account').innerHTML='<option value="all">All accounts</option>'+vals.map(v=>`<option>${v}</option>`).join('');$('account').value=filters.account}
function render(){const data=filtered(), ins=data.filter(r=>r.direction==='IN').reduce((s,r)=>s+r.amount,0), outs=data.filter(r=>r.direction==='OUT').reduce((s,r)=>s+r.amount,0);$('inTotal').textContent=money(ins);$('outTotal').textContent=money(outs);$('net').textContent=money(ins-outs);$('net').className='value '+(ins-outs>=0?'net-positive':'net-negative');$('count').textContent=data.length.toLocaleString();$('shown').textContent=`${data.length.toLocaleString()} transaction${data.length===1?'':'s'}`;renderChart(data);$('table').innerHTML=data.length?`<table><thead><tr><th>Date</th><th>Transaction</th><th>Account</th><th>Direction</th><th>Amount</th><th>Reason</th></tr></thead><tbody>${data.map(r=>`<tr><td>${r.date}</td><td>${r.id}</td><td>${r.account}</td><td class="direction ${r.direction==='IN'?'in':'out'}">${r.direction==='IN'?'↑ IN':'↓ OUT'}</td><td class="${r.direction==='IN'?'in':'out'}">${money(r.amount)}</td><td>${r.reason}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No transactions match the selected filters.</div>'}
function renderChart(data){const svg=$('chart'),days={};data.forEach(r=>{days[r.date]??={IN:0,OUT:0};days[r.date][r.direction]+=r.amount});const vals=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0])).slice(-30);if(!vals.length){svg.innerHTML='<text x="500" y="140" text-anchor="middle" fill="#64748b">No movement data for this view</text>';return}const w=1000,h=280,p={l:55,r:20,t:20,b:45},cw=w-p.l-p.r,ch=h-p.t-p.b,max=Math.max(...vals.map(([,v])=>Math.max(v.IN,v.OUT)),1),bw=Math.max(8,cw/vals.length*.28);const grid=[0,1,2,3,4].map(i=>{const y=p.t+ch*i/4;return`<line x1="${p.l}" x2="${w-p.r}" y1="${y}" y2="${y}" stroke="#dbe3ef" stroke-dasharray="4 5"/>`}).join('');const bars=vals.map(([date,v],i)=>{const x=p.l+(i+.5)*cw/vals.length;const ih=v.IN/max*ch,oh=v.OUT/max*ch;return`<g><rect x="${x-bw-2}" y="${p.t+ch-ih}" width="${bw}" height="${ih}" rx="4" fill="#059669"><title>${date} IN ${money(v.IN)}</title></rect><rect x="${x+2}" y="${p.t+ch-oh}" width="${bw}" height="${oh}" rx="4" fill="#dc2626"><title>${date} OUT ${money(v.OUT)}</title></rect><text x="${x}" y="${h-15}" text-anchor="middle" font-size="10" fill="#64748b">${date.slice(5)}</text></g>`}).join('');svg.innerHTML=`${grid}<line x1="${p.l}" x2="${w-p.r}" y1="${p.t+ch}" y2="${p.t+ch}" stroke="#94a3b8"/>${bars}`}
function refresh(){options();render()}$('account').onchange=e=>{filters.account=e.target.value;render()};$('from').onchange=e=>{filters.from=e.target.value;render()};$('to').onchange=e=>{filters.to=e.target.value;render()};$('reset').onclick=()=>{filters={account:'all',from:'',to:''};$('from').value='';$('to').value='';refresh()};$('sample').onclick=()=>{rows=sample();$('source').textContent='Generated sample dataset';filters={account:'all',from:'',to:''};refresh()};$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{rows=parseCSV(reader.result);$('source').textContent='Loaded: '+f.name;filters={account:'all',from:'',to:''};refresh()}catch(err){alert(err.message)}};reader.readAsText(f)};rows=sample();refresh();
</script></body></html>
